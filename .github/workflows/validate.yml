name: XVROS Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  xvbin-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run XVROS BIN Python validator tests
        run: |
          cd tools
          python3 -m unittest -v

  xvbin-c-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile C validator with strict warnings
        run: gcc -std=c11 -Wall -Wextra -Werror -pedantic firmware/xvbin.c firmware/test_xvbin.c -o xvbin-c-tests
      - name: Run C validator tests
        run: ./xvbin-c-tests

  xvros-core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile portable core tests with strict warnings
        run: gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude source/core/xvros_core.c tests/test_xvros_core.c -o xvros-core-tests
      - name: Run portable core tests
        run: ./xvros-core-tests
